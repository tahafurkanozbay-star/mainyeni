name: API.User IIS Bundle

on:
  pull_request:
    paths:
      - 'Api.User/**'
      - 'Api.Core/**'
      - 'Business/**'
      - 'Toolbox/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'Operations/publish-webclient-api-iis.ps1'
      - '.github/workflows/api-user-iis-bundle.yml'
  push:
    branches:
      - main
    paths:
      - 'Api.User/**'
      - 'Api.Core/**'
      - 'Business/**'
      - 'Toolbox/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'Operations/publish-webclient-api-iis.ps1'
      - '.github/workflows/api-user-iis-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-user-iis-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Verify SDK
        shell: pwsh
        run: |
          dotnet --info
          $version = dotnet --version
          if ($LASTEXITCODE -ne 0) { throw "dotnet --version failed." }
          if ([int]($version.Split('.')[0]) -ne 10) { throw "Expected .NET 10 SDK but found $version." }

      - name: Publish and package only Api.User
        shell: pwsh
        run: .\Operations\publish-webclient-api-iis.ps1 -Configuration Release

      - name: Upload Api.User IIS ZIP
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: api-user-iis-${{ github.sha }}
          path: artifacts/iis-api-user/api-user-iis.zip
          if-no-files-found: error
          retention-days: 14
