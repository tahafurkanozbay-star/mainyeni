name: Platform Architecture Audit

on:
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.props'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/tsconfig*.json'
      - 'global.json'
      - '**/*.css'
      - '.github/workflows/**'
      - 'tools/platform-audit.mjs'
      - 'tools/platform-audit.test.mjs'
      - 'tools/platform-contracts.mjs'
      - 'tools/platform-contracts.test.mjs'
      - 'tools/package-lock-integrity.mjs'
      - 'tools/package-lock-integrity.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-architecture-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Unit tests
        run: >-
          node --test
          tools/platform-audit.test.mjs
          tools/platform-contracts.test.mjs
          tools/platform-module-graph.test.mjs
          tools/platform-language-ratchet.test.mjs
          tools/platform-boundary-audit.test.mjs
          tools/browser-runtime-boundary.test.mjs
          tools/package-lock-integrity.test.mjs

      - name: Enforce modernization contracts
        run: node tools/platform-contracts.mjs

      - name: Enforce typed module graph
        run: node tools/platform-module-graph.mjs --strict

      - name: Enforce language modernization ratchet
        run: node tools/platform-language-ratchet.mjs --strict

      - name: Enforce Platform responsibility boundaries
        run: node tools/platform-boundary-audit.mjs --strict

      - name: Enforce browser runtime boundary
        run: node tools/browser-runtime-boundary.mjs --strict

      - name: Generate architecture inventory
        run: node tools/platform-audit.mjs

      - name: Audit package lock integrity
        run: node tools/package-lock-integrity.mjs

      - name: Publish summary
        if: always()
        run: |
          for report in \
            artifacts/platform-audit/platform-contracts.md \
            artifacts/platform-audit/platform-audit.md \
            artifacts/platform-audit/platform-module-graph.md \
            artifacts/platform-audit/language-modernization.md \
            artifacts/platform-audit/platform-boundaries.md \
            artifacts/platform-audit/browser-runtime-boundary.md \
            artifacts/platform-audit/package-lock-integrity.md
          do
            if [ -f "$report" ]; then
              if [ -s "$GITHUB_STEP_SUMMARY" ]; then
                printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
              fi
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: platform-architecture-audit
          path: artifacts/platform-audit/
          if-no-files-found: error
          retention-days: 14
