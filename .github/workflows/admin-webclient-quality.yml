name: Admin Webclient Quality

on:
  pull_request:
    paths:
      - 'Webclient.admin/**'
      - 'tools/admin-modernization-audit.mjs'
      - 'tools/admin-modernization-audit.test.mjs'
      - 'tools/admin-modernization-baseline.json'
      - '.github/workflows/admin-webclient-quality.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'Webclient.admin/**'
      - 'tools/admin-modernization-audit.mjs'
      - 'tools/admin-modernization-audit.test.mjs'
      - 'tools/admin-modernization-baseline.json'
      - '.github/workflows/admin-webclient-quality.yml'

permissions:
  contents: read

concurrency:
  group: admin-webclient-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Webclient.admin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Webclient.admin/package-lock.json

      - name: Toolchain diagnostics
        run: |
          node --version
          npm --version

      - name: Install from lockfile
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Admin modernization ratchet
        run: npm run quality:modernization

      - name: Modernization audit self-test
        run: npm run test:tooling

      - name: Strict lint
        run: npm run lint:strict

      - name: Strict TypeScript
        run: npm run typecheck

      - name: Vitest regression suite
        run: npm test

      - name: Production Vite build
        env:
          CI: true
        run: npm run build
