name: Admin Webclient Quality

on:
  pull_request:
    paths:
      - 'Webclient.admin/**'
      - '.github/workflows/admin-webclient-quality.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'Webclient.admin/**'
      - '.github/workflows/admin-webclient-quality.yml'

permissions:
  contents: read

concurrency:
  group: admin-webclient-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Webclient.admin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Webclient.admin/package-lock.json

      - name: Install from lockfile
        run: npm ci --no-audit --no-fund

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency contract
        run: npm run dependency:verify

      - name: Admin modernization audit
        run: npm run quality:migration

      - name: Strict lint
        run: npm run lint:strict

      - name: TypeScript 7 strict typecheck
        run: npm run typecheck

      - name: Vitest regression suite
        run: npm run test:ci

      - name: Production Vite build and integrity budgets
        env:
          CI: true
        run: npm run build
