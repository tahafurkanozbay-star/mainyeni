name: ArcGIS Query Session Lint Fix

on:
  push:
    branches:
      - agent/arcgis-legacy-zero-20260917

permissions:
  contents: write

jobs:
  fix-unused-metadata:
    if: ${{ !contains(github.event.head_commit.message, '[query-session-lint-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/arcgis-legacy-zero-20260917
          fetch-depth: 0

      - name: Remove write-only metadata state
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'Webclient.app/src/gis-engine/arcgisQuerySessionRuntime.ts';
          const source = fs.readFileSync(path, 'utf8');
          const next = source
            .replace('  #metadata: ArcGisLayerMetadataLike;\n', '')
            .replace('    this.#metadata = configuration.metadata;\n', '')
            .replace('    this.#metadata = metadata;\n', '');
          if (next === source) throw new Error('Expected metadata cleanup change');
          if (next.includes('#metadata')) throw new Error('Write-only metadata state remains');
          fs.writeFileSync(path, next);
          NODE

      - name: Verify focused diff
        run: |
          git diff --check
          git diff -- Webclient.app/src/gis-engine/arcgisQuerySessionRuntime.ts

      - name: Commit lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Webclient.app/src/gis-engine/arcgisQuerySessionRuntime.ts
          git commit -m "fix(gis): remove write-only query session metadata [query-session-lint-fix]"
          git push origin HEAD:agent/arcgis-legacy-zero-20260917
