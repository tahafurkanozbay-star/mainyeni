name: Release QA

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/qa-*'

permissions:
  contents: read

concurrency:
  group: release-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typed-release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout with baseline history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify Node native TypeScript runtime
        run: node --version

      - name: TypeScript 7.0.2 strict typecheck
        run: npx --yes --package=typescript@7.0.2 tsc -p quality/release/tsconfig.json

      - name: Typed QA unit and regression tests
        run: node --test quality/release/*.test.mts

      - name: Generate whole-repository release scorecard
        run: node quality/release/cli.mts --root . --output qa-artifacts/release

      - name: Materialize exact PR base tree
        if: github.event_name == 'pull_request'
        run: git worktree add --detach /tmp/release-baseline "${{ github.event.pull_request.base.sha }}"

      - name: Enforce exact-base PR regression gate
        if: github.event_name == 'pull_request'
        run: >-
          node quality/release/pr-gate.mts
          --root .
          --baseline-root /tmp/release-baseline
          --baseline-commit "${{ github.event.pull_request.base.sha }}"
          --current-commit "${{ github.sha }}"
          --output qa-artifacts/release

      - name: Upload typed release QA artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: typed-release-qa
          path: qa-artifacts/release
          if-no-files-found: warn
          retention-days: 21

  webclient-release-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Webclient.app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Webclient.app/package-lock.json

      - name: Install from lockfile
        run: npm ci

      - name: Dependency and lockfile contract
        run: npm run dependency:verify

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Vite migration contract
        run: npm run quality:vite --if-present

      - name: GIS query governance contract
        run: npm run quality:gis-query-governance

      - name: Full lint visibility
        run: npm run lint --if-present

      - name: Strict lint on changed Webclient sources
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            npm run lint:strict --if-present
            exit 0
          fi
          git -C .. fetch --no-tags --depth=1 origin "$BASE_SHA"
          mapfile -t changed_files < <(
            git -C .. diff --name-only "$BASE_SHA" HEAD -- \
              Webclient.app/src \
              Webclient.app/tooling \
              Webclient.app/vite.config.ts \
              Webclient.app/vitest.config.ts \
            | sed 's#^Webclient.app/##' \
            | awk '/\.(cjs|mjs|js|jsx|ts|tsx)$/'
          )
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed Webclient lint targets."
          else
            printf 'Strict lint targets:\n - %s\n' "${changed_files[@]}"
            npx oxlint --deny-warnings "${changed_files[@]}"
          fi

      - name: Full TypeScript diagnostic visibility
        run: |
          set +e
          npx tsc --noEmit -p tsconfig.json --pretty false 2>&1 | tee /tmp/current-typecheck.log
          echo "Full TypeScript diagnostics remain visible; staged migration is enforced by the exact-base regression gate."
          exit 0

      - name: Strict supervision TypeScript boundary
        run: npx tsc --noEmit -p tsconfig.supervision.json --pretty false

      - name: Exact-base TypeScript regression gate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git -C .. fetch --no-tags origin "$BASE_SHA"
          rm -rf /tmp/typecheck-baseline
          git -C .. worktree add --detach /tmp/typecheck-baseline "$BASE_SHA"
          trap 'git -C .. worktree remove --force /tmp/typecheck-baseline >/dev/null 2>&1' EXIT
          set +e
          (
            cd /tmp/typecheck-baseline/Webclient.app
            npm ci --ignore-scripts --no-audit --no-fund >/tmp/typecheck-baseline-install.log 2>&1
            npx tsc --noEmit -p tsconfig.json --pretty false >/tmp/baseline-typecheck.log 2>&1
          )
          set -e
          node scripts/typecheck-regression.mjs /tmp/baseline-typecheck.log /tmp/current-typecheck.log
          git -C .. worktree remove --force /tmp/typecheck-baseline
          trap - EXIT

      # Full-suite and exact-base Vitest regression authority lives in
      # Webclient Quality. Release QA intentionally avoids re-running the same
      # memory-intensive jsdom/fork suite in parallel on the same PR, while
      # retaining independent lint/typecheck/release-scorecard/build gates.

      - name: Native tooling regression suite
        run: npm run test:tooling --if-present

      - name: Build budget script tests
        run: npm run test:build-budget --if-present

      - name: Production build and integrity manifest
        env:
          CI: true
        run: npm run build

      - name: Verify production bundle integrity
        run: npm run build:verify --if-present

      - name: Enforce production build budgets
        run: node scripts/web-build-budget.mjs build --strict

  backend-release-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 LTS
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: SDK diagnostics
        run: dotnet --info

      - name: Restore with audit
        run: dotnet restore CityWorks.NetCore.sln

      - name: Dependency vulnerability report
        run: dotnet list CityWorks.NetCore.sln package --vulnerable --include-transitive

      - name: Release build
        run: dotnet build CityWorks.NetCore.sln --configuration Release --no-restore

      - name: Run xUnit v3 tests through Microsoft.Testing.Platform
        run: dotnet run --project tests/Platform.Security.Tests/Platform.Security.Tests.csproj --configuration Release --no-build --no-restore

      - name: Publish User API
        run: dotnet publish Api.User/Api.User.csproj --configuration Release --no-build --no-restore --output /tmp/publish-user

      - name: Publish Admin API
        run: dotnet publish Api.Admin/Api.Admin.csproj --configuration Release --no-build --no-restore --output /tmp/publish-admin
