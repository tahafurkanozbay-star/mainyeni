name: Release QA

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

concurrency:
  group: release-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webclient-release-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Webclient.app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Webclient.app/package-lock.json

      - name: Install from lockfile
        run: npm ci

      - name: Release QA unit contracts
        run: npx jest scripts/release-qa-audit.test.js --runInBand

      - name: Generate static release audit
        run: node scripts/release-qa-audit.js --strict

      - name: Full regression suite
        run: npm test -- --watchAll=false --runInBand

      - name: Production build
        env:
          CI: true
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-qa-report
          path: |
            Webclient.app/qa-artifacts/release-qa-report.json
            Webclient.app/qa-artifacts/release-qa-report.md
          if-no-files-found: warn
          retention-days: 14
