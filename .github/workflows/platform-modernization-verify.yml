name: Platform Modernization Verify

on:
  push:
    branches:
      - agent/platform-modernization-20260916-1045-f3f3c0f
    paths:
      - '.github/workflows/platform-modernization-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Webclient.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: node --test scripts/web-build-budget.test.mjs
      - run: npm run build
      - run: npm run build:verify
      - run: node scripts/web-build-budget.mjs build --strict
