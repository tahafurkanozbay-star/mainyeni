name: Platform Offline Validation

on:
  pull_request:
    paths:
      - 'Webclient.app/src/platform/offline/**'
      - 'Webclient.app/tsconfig.offline.json'
      - '.github/workflows/platform-offline-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'Webclient.app/src/platform/offline/**'
      - 'Webclient.app/tsconfig.offline.json'
      - '.github/workflows/platform-offline-validation.yml'

permissions:
  contents: read

concurrency:
  group: platform-offline-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Webclient.app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Webclient.app/package-lock.json

      - name: Install from lockfile
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Strict lint offline runtime
        run: npx oxlint --deny-warnings src/platform/offline

      - name: Typecheck offline runtime
        run: npx tsc --noEmit -p tsconfig.offline.json --pretty false

      - name: Focused offline runtime tests
        run: npx vitest run src/platform/offline --reporter=verbose
