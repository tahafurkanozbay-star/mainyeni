name: Typed Source Boundary

on:
  pull_request:
    paths:
      - 'Webclient.app/src/**'
      - 'tools/typed-source-boundary.mts'
      - 'tools/typed-source-boundary.test.mts'
      - 'tools/tooling-typescript-cutover.test.mts'
      - '.github/workflows/typed-source-boundary.yml'
  push:
    branches:
      - main
    paths:
      - 'Webclient.app/src/**'
      - 'tools/typed-source-boundary.mts'
      - 'tools/typed-source-boundary.test.mts'
      - 'tools/tooling-typescript-cutover.test.mts'
      - '.github/workflows/typed-source-boundary.yml'

permissions:
  contents: read

concurrency:
  group: typed-source-boundary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typed-source-boundary:
    name: typed-source-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Audit unit tests
        run: node --test tools/typed-source-boundary.test.mts tools/tooling-typescript-cutover.test.mts

      - name: Enforce typed source boundary
        run: node tools/typed-source-boundary.mts --strict
