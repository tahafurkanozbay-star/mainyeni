name: Platform Lockfile Refresh

on:
  push:
    branches:
      - agent/platform-modernization-20260916-1045-f3f3c0f
    paths:
      - 'Webclient.app/package.json'
      - '.github/workflows/platform-lockfile-refresh.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/platform-modernization-20260916-1045-f3f3c0f
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve lockfile
        working-directory: Webclient.app
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install
        working-directory: Webclient.app
        run: npm ci --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Webclient.app/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(web): refresh npm lockfile'
          git push origin HEAD:agent/platform-modernization-20260916-1045-f3f3c0f
