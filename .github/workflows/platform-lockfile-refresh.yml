name: Platform Lockfile Refresh

on:
  push:
    branches:
      - 'agent/platform-20260916-typescript-vite-a6dcdee'
    paths:
      - 'Webclient.app/package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: platform-lockfile-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Webclient.app
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Webclient.app/package-lock.json

      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already matches package.json'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(web): refresh npm lockfile for modern toolchain'
          git push origin HEAD:${{ github.ref_name }}
