name: One-shot Verified Lint Codemod V2

on:
  push:
    branches:
      - agent/data-search-production-v2-20260916-1246-851a5c9

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/data-search-production-v2-20260916-1246-851a5c9
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Webclient.app/package-lock.json
      - name: Install from lockfile
        working-directory: Webclient.app
        run: npm ci
      - name: Apply targeted cleanup
        run: python .github/scripts/verified-lint-cleanup.py
      - name: Apply Oxlint fixes and suggestions
        working-directory: Webclient.app
        run: npx --no-install oxlint --fix --fix-suggestions src tooling vite.config.ts vitest.config.ts || true
      - name: Validate complete webclient gate
        working-directory: Webclient.app
        run: npm run verify
      - name: Validate patch whitespace
        run: git diff --check
      - name: Commit verified cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No verified cleanup changes were available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Webclient.app/src Webclient.app/tooling Webclient.app/vite.config.ts Webclient.app/vitest.config.ts Webclient.app/tsconfig.json
          git commit -m "chore(search): resolve strict lint debt with verified codemod"
          git push origin HEAD:agent/data-search-production-v2-20260916-1246-851a5c9
