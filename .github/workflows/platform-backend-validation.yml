name: Platform Backend Validation

on:
  pull_request:
    paths:
      - 'Api.Admin/**'
      - 'Api.Core/**'
      - 'Api.User/**'
      - 'Business/**'
      - 'Toolbox/**'
      - 'tests/**'
      - 'Directory.Build.props'
      - 'global.json'
      - 'CityWorks.NetCore.sln'
      - '.github/workflows/platform-backend-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'Api.Admin/**'
      - 'Api.Core/**'
      - 'Api.User/**'
      - 'Business/**'
      - 'Toolbox/**'
      - 'tests/**'
      - 'Directory.Build.props'
      - 'global.json'
      - 'CityWorks.NetCore.sln'
      - '.github/workflows/platform-backend-validation.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup .NET 10 LTS
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: SDK diagnostics
        run: dotnet --info

      - name: Restore with NuGet audit
        run: dotnet restore CityWorks.NetCore.sln

      - name: Dependency vulnerability report
        run: dotnet list CityWorks.NetCore.sln package --vulnerable --include-transitive

      - name: Build Release
        run: dotnet build CityWorks.NetCore.sln --configuration Release --no-restore

      - name: Run xUnit v3 tests through Microsoft.Testing.Platform
        id: platform-tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/test-diagnostics
          dotnet run --project tests/Platform.Security.Tests/Platform.Security.Tests.csproj --configuration Release --no-build --no-restore 2>&1 | tee artifacts/test-diagnostics/platform-security-tests.log

      - name: Surface backend test failure diagnostics
        if: failure() && steps.platform-tests.outcome == 'failure'
        shell: bash
        run: |
          log='artifacts/test-diagnostics/platform-security-tests.log'
          if [[ ! -s "$log" ]]; then
            echo '### Platform backend test failure' >> "$GITHUB_STEP_SUMMARY"
            echo 'The test process failed without producing a diagnostic log.' >> "$GITHUB_STEP_SUMMARY"
            echo '::error title=Platform backend tests failed::The test process failed without producing a diagnostic log.'
            exit 1
          fi

          echo '### Platform backend test failure diagnostics' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 160 "$log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Annotation extraction is diagnostic-only: an empty grep result is valid when the
          # runner terminates without a conventional xUnit failure marker. Avoid shell-level
          # failure masking by handling grep status explicitly instead of using `|| true`.
          matches='artifacts/test-diagnostics/platform-security-failure-lines.log'
          grep -E '(^|[[:space:]])(failed|FAIL|Error Message:|Stack Trace:|\[FAIL\]|\[x\])' "$log" > "$matches" || grep_status=$?
          if [[ ${grep_status:-0} -gt 1 ]]; then
            echo '::error title=Platform backend diagnostics::Failed to scan the xUnit diagnostic log.'
            exit "$grep_status"
          fi

          tail -n 20 "$matches" | while IFS= read -r line; do
            safe=${line//'%'/'%25'}
            safe=${safe//$'\r'/'%0D'}
            safe=${safe//$'\n'/'%0A'}
            echo "::error title=Platform backend test failure::$safe"
          done

      - name: Upload backend test diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: platform-backend-test-diagnostics-${{ github.run_id }}
          path: artifacts/test-diagnostics/
          if-no-files-found: error
          retention-days: 7

      - name: Publish User API
        run: dotnet publish Api.User/Api.User.csproj --configuration Release --no-build --no-restore --output artifacts/api-user

      - name: Publish Admin API
        run: dotnet publish Api.Admin/Api.Admin.csproj --configuration Release --no-build --no-restore --output artifacts/api-admin
