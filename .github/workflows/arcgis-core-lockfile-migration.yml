name: ArcGIS Core Lockfile Migration

on:
  push:
    branches:
      - agent/arcgis-core-esm-20260918

permissions:
  contents: write

jobs:
  migrate-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[arcgis-core-lock]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v7
        with:
          ref: agent/arcgis-core-esm-20260918
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Webclient.app/package-lock.json

      - name: Replace retired loader with ArcGIS 5.1 ESM
        working-directory: Webclient.app
        run: |
          npm uninstall esri-loader --ignore-scripts --no-audit --no-fund
          npm install --save-exact @arcgis/core@5.1.24 --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run dependency:verify
          node -e "const p=require('./package.json'); if(p.dependencies['esri-loader']) process.exit(1); if(p.dependencies['@arcgis/core']!=='5.1.24') process.exit(2)"

      - name: Commit manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Webclient.app/package.json Webclient.app/package-lock.json
          git diff --cached --check
          git commit -m "build(gis): replace esri-loader with @arcgis/core 5.1.24 [arcgis-core-lock]"
          git push origin HEAD:agent/arcgis-core-esm-20260918
