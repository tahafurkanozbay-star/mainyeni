name: Admin Lock Refresh

on:
  push:
    branches:
      - 'agent/platform-admin-vite-ts-*'
    paths:
      - 'Webclient.admin/package.json'
      - '.github/workflows/admin-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Resolve admin lockfile with npm
        working-directory: Webclient.admin
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Webclient.admin/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git commit -m "chore(admin): refresh Vite migration lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
