name: Temporary Platform Supervision Fix

on:
  push:
    branches:
      - agent/platform-runtime-supervision-20260916-1626-3c6eaa8-r2
    paths:
      - '.github/workflows/platform-supervision-fix.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/platform-runtime-supervision-20260916-1626-3c6eaa8-r2
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Webclient.app/package-lock.json

      - name: Apply deterministic supervision fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'Webclient.app/src/platform/runtime/supervision/lifecycleCoordinator.test.ts',
              """    const first = { resolve: () => undefined as void };\n    let resolveA!: () => void;\n    let resolveB!: () => void;\n    const gateA = new Promise<void>((resolve) => { resolveA = resolve; first.resolve = resolve; });\n    const gateB = new Promise<void>((resolve) => { resolveB = resolve; });\n    const starts: string[] = [];\n    const coordinator = new LifecycleCoordinator({ concurrency: 2 });\n    coordinator.register({ id: 'root', start: () => undefined });\n    coordinator.register({\n      id: 'a', dependencies: [{ id: 'root' }], start: async () => { starts.push('a'); await gateA; },\n    });\n    coordinator.register({\n      id: 'b', dependencies: [{ id: 'root' }], start: async () => { starts.push('b'); await gateB; },\n    });\n    const pending = coordinator.startAll();\n    await flush();\n    await flush();\n    expect(starts.sort()).toEqual(['a', 'b']);\n""",
              """    let resolveA!: () => void;\n    let resolveB!: () => void;\n    let resolveBothStarted!: () => void;\n    const gateA = new Promise<void>((resolve) => { resolveA = resolve; });\n    const gateB = new Promise<void>((resolve) => { resolveB = resolve; });\n    const bothStarted = new Promise<void>((resolve) => { resolveBothStarted = resolve; });\n    const starts: string[] = [];\n    const recordStart = (id: string): void => {\n      starts.push(id);\n      if (starts.length === 2) resolveBothStarted();\n    };\n    const coordinator = new LifecycleCoordinator({ concurrency: 2 });\n    coordinator.register({ id: 'root', start: () => undefined });\n    coordinator.register({\n      id: 'a', dependencies: [{ id: 'root' }], start: async () => { recordStart('a'); await gateA; },\n    });\n    coordinator.register({\n      id: 'b', dependencies: [{ id: 'root' }], start: async () => { recordStart('b'); await gateB; },\n    });\n    const pending = coordinator.startAll();\n    await bothStarted;\n    expect(starts.sort()).toEqual(['a', 'b']);\n""",
          )

          replace_once(
              'Webclient.app/src/platform/runtime/supervision/requestCoordinator.ts',
              """          this.#settleSubscriber(unknownSubscriber, false, cancellationReason(signal));\n          this.#cleanupTaskIfOrphaned(task);\n""",
              """          const cancellation = cancellationReason(signal);\n          this.#settleSubscriber(unknownSubscriber, false, cancellation);\n          this.#cleanupTaskIfOrphaned(task, cancellation);\n""",
          )
          replace_once(
              'Webclient.app/src/platform/runtime/supervision/requestCoordinator.ts',
              """        this.#settleSubscriber(\n          current,\n          false,\n          reason ?? new DOMException('Request subscriber cancelled.', 'AbortError'),\n        );\n        this.#cleanupTaskIfOrphaned(task);\n""",
              """        const cancellation = reason ?? new DOMException('Request subscriber cancelled.', 'AbortError');\n        this.#settleSubscriber(current, false, cancellation);\n        this.#cleanupTaskIfOrphaned(task, cancellation);\n""",
          )
          replace_once(
              'Webclient.app/src/platform/runtime/supervision/requestCoordinator.ts',
              """  #cleanupTaskIfOrphaned(task: RequestTask): void {\n""",
              """  #cleanupTaskIfOrphaned(task: RequestTask, reason?: unknown): void {\n""",
          )
          replace_once(
              'Webclient.app/src/platform/runtime/supervision/requestCoordinator.ts',
              """      task.controller.abort(new DOMException('All request subscribers cancelled.', 'AbortError'));\n""",
              """      task.controller.abort(reason ?? new DOMException('All request subscribers cancelled.', 'AbortError'));\n""",
          )

          replace_once(
              'Webclient.app/src/platform/runtime/supervision/requestCoordinator.test.ts',
              """    await flush();\n    handle.cancel('no listeners');\n    await expect(observed.promise).resolves.toBe('no listeners');\n    await expect(handle.promise).rejects.toBe('no listeners');\n    await flush();\n""",
              """    await flush();\n    const subscriberRejection = expect(handle.promise).rejects.toBe('no listeners');\n    handle.cancel('no listeners');\n    await expect(observed.promise).resolves.toBe('no listeners');\n    await subscriberRejection;\n    await flush();\n""",
          )

          replace_once(
              'Webclient.app/src/platform/runtime/resilience.hardening.test.ts',
              """    const pending = withTimeout(operation, 50);\n    await vi.advanceTimersByTimeAsync(51);\n\n    await expect(pending).rejects.toMatchObject({\n      name: 'OperationTimeoutError',\n      code: 'OPERATION_TIMEOUT',\n      timeoutMs: 50,\n    });\n""",
              """    const pending = withTimeout(operation, 50);\n    const deadlineRejection = expect(pending).rejects.toMatchObject({\n      name: 'OperationTimeoutError',\n      code: 'OPERATION_TIMEOUT',\n      timeoutMs: 50,\n    });\n    await vi.advanceTimersByTimeAsync(51);\n\n    await deadlineRejection;\n""",
          )
          PY

      - name: Validate strict Platform slice
        working-directory: Webclient.app
        shell: bash
        run: |
          npm ci
          npx oxlint --deny-warnings \
            src/platform/runtime/supervision/lifecycleCoordinator.test.ts \
            src/platform/runtime/supervision/requestCoordinator.ts \
            src/platform/runtime/supervision/requestCoordinator.test.ts \
            src/platform/runtime/resilience.hardening.test.ts
          npx tsc --noEmit -p tsconfig.supervision.json --pretty false
          npx vitest run \
            src/platform/runtime/supervision/dependencyGraph.test.ts \
            src/platform/runtime/supervision/healthRegistry.test.ts \
            src/platform/runtime/supervision/lifecycleCoordinator.test.ts \
            src/platform/runtime/supervision/requestCoordinator.test.ts \
            src/platform/runtime/supervision/requestCoordinator.fairness.test.ts \
            src/platform/runtime/supervision/runtimeSupervisor.test.ts \
            src/platform/runtime/resilience.hardening.test.ts

      - name: Commit validated fixes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/platform-supervision-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Webclient.app/src/platform/runtime/supervision/lifecycleCoordinator.test.ts \
            Webclient.app/src/platform/runtime/supervision/requestCoordinator.ts \
            Webclient.app/src/platform/runtime/supervision/requestCoordinator.test.ts \
            Webclient.app/src/platform/runtime/resilience.hardening.test.ts \
            .github/workflows/platform-supervision-fix.yml
          git commit -m 'fix(platform): make supervision cancellation and concurrency deterministic'
          git push origin HEAD:agent/platform-runtime-supervision-20260916-1626-3c6eaa8-r2
