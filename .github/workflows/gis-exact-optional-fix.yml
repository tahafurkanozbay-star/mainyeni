name: GIS exact optional compatibility fix

on:
  push:
    branches:
      - agent/gis-deep-20260924-0912-00810ca

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[gis-ts-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/gis-deep-20260924-0912-00810ca
          fetch-depth: 0
      - name: Apply exactOptionalPropertyTypes compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          spatial = Path('Webclient.app/src/gis-engine/spatialOperationCoordinator.ts')
          text = spatial.read_text()
          replacements = {
              '  readonly signal?: AbortSignal;': '  readonly signal?: AbortSignal | undefined;',
              '  abortListener?: () => void;': '  abortListener?: (() => void) | undefined;',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing spatial marker: {old}')
              text = text.replace(old, new, 1)
          spatial.write_text(text)

          transition = Path('Webclient.app/src/gis-engine/viewStateTransitionCoordinator.ts')
          text = transition.read_text()
          replacements = {
              '  private current?: UnifiedViewState;': '  private current: UnifiedViewState | undefined;',
              '  private pending?: PendingTransition;': '  private pending: PendingTransition | undefined;',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing transition marker: {old}')
              text = text.replace(old, new, 1)
          transition.write_text(text)
          PY
          git diff --check
      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Webclient.app/src/gis-engine/spatialOperationCoordinator.ts Webclient.app/src/gis-engine/viewStateTransitionCoordinator.ts
          git commit -m "fix(gis): align recovered runtimes with strict TS7 [gis-ts-fix]"
          git push origin HEAD:agent/gis-deep-20260924-0912-00810ca
