name: Başkent 3D GIS CI

on:
  push:
    paths:
      - 'baskent-3d-gis/**'
      - '.github/workflows/baskent-3d-gis-ci.yml'
  pull_request:
    paths:
      - 'baskent-3d-gis/**'
      - '.github/workflows/baskent-3d-gis-ci.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baskent-3d-gis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
