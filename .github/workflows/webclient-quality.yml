name: Webclient Quality

on:
  pull_request:
    paths:
      - 'Webclient.app/**'
      - '.github/workflows/webclient-quality.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'Webclient.app/**'
      - '.github/workflows/webclient-quality.yml'

permissions:
  contents: read

concurrency:
  group: webclient-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Webclient.app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Webclient.app/package-lock.json

      - name: Verify Node toolchain contract
        shell: bash
        run: |
          node --version
          npm --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major !== 24) process.exit(1)"

      - name: Install from lockfile
        run: npm ci

      - name: Production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Production build
        env:
          CI: true
        run: npm run build

      - name: Verify production bundle
        run: node scripts/verify-build.mjs
