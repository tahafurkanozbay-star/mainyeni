name: Webclient Quality

on:
  push:
    branches:
      - agent/data-search-production-v2-20260916-1246-851a5c9
    paths:
      - 'Webclient.app/**'
      - '.github/scripts/**'
      - '.github/workflows/webclient-quality.yml'
      - 'tests/Platform.Security.Tests/**'

permissions:
  contents: write

concurrency:
  group: webclient-quality-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/data-search-production-v2-20260916-1246-851a5c9
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Webclient.app/package-lock.json

      - name: Install from lockfile
        working-directory: Webclient.app
        run: npm ci

      - name: Apply targeted verified cleanup
        run: |
          python .github/scripts/verified-lint-cleanup.py
          python .github/scripts/verified-lint-cleanup-final.py

      - name: Apply Oxlint safe fixes and suggestions
        working-directory: Webclient.app
        run: npx --no-install oxlint --fix --fix-suggestions src tooling vite.config.ts vitest.config.ts || true

      - name: Validate complete webclient gate
        working-directory: Webclient.app
        run: npm run verify

      - name: Validate dependency and security contracts
        working-directory: Webclient.app
        run: |
          npm run dependency:verify
          node scripts/experience-quality-audit.js
          npm run quality:vite
          npm audit --omit=dev --audit-level=high

      - name: Restore canonical workflow and remove one-shot scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/webclient-quality.yml
          rm -f .github/workflows/one-shot-integrate-current-main.yml
          rm -f .github/workflows/one-shot-verified-lint-codemod-v2.yml
          rm -f .github/scripts/verified-lint-cleanup.py
          rm -f .github/scripts/verified-lint-cleanup-final.py

          cat >> KENT_REHBERI_PROGRESS.md <<'EOF'

## Deep Data / Search Final Merge Gate — 2026-09-16 16:13 TRT
- PR #59, current `main` `3c6eaa8b35eca2da1219ddaab9f90d16a3255a79` (GIS PR #66) üzerine force kullanmadan iki-parent `f21014fd08d78c815ebca71d5d15ee053aefb270` entegrasyon commit'i ile güncellenmiştir; compare sonrası `behind=0` ve `main` merge-base/ancestor olarak doğrulanmıştır.
- PR #66'nın 13 yeni bounded ArcGIS runtime/test dosyası korunmuştur; shared progress tarihçesi truncate edilmemiştir.
- Webclient dependency/Vite/Experience/security contract hataları gerçek kod/sözleşme düzeltmeleriyle giderilmiştir; eski undeclared runtime paketleri manifesti şişirmeden native/local uyumluluk katmanlarına taşınmıştır.
- Backend same-origin güvenlik testi implementation string biçimine değil gerçek protocol-relative path rejection semantiğine hizalanmıştır; endpoint policy `//` yollarını fail-closed reddetmeye devam eder.
- Repository-geneli strict lint borcu gate'i gevşetmeden hedefli cleanup + Oxlint safe fix ile temizlenmiş, `npm run verify` ve dependency/security kontrolleri cleanup commit'i üretilmeden önce başarıyla çalıştırılmıştır.
- Geçici one-shot workflow/codemod scaffolding final branch ağacından kaldırılmış ve canonical Webclient Quality workflow'u `main` sürümüne geri döndürülmüştür. Merge yalnız bu final head'in exact-head Webclient Quality, Release QA, Platform Architecture Audit ve gerekli backend validation sonuçları success olduğunda yapılacaktır.
- Network/GIS sınırları korunmuştur: WMS/WFS/WMTS veya uydurma endpoint eklenmemiştir; `iconRegistry.json` + shared resolver/presentation tek GIS icon authority olmaya devam eder.
EOF

      - name: Validate final patch
        run: |
          git diff --check
          test "$(git show origin/main:.github/workflows/webclient-quality.yml)" = "$(cat .github/workflows/webclient-quality.yml)"
          git diff -- Webclient.app/package.json Webclient.app/package-lock.json
          test -z "$(git diff --name-only -- Webclient.app/src/gis-engine/iconRegistry.json Webclient.app/src/gis-engine/iconPresentation.ts Webclient.app/src/gis-engine/iconResolver.ts)"

      - name: Commit verified cleanup and final gate state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 1
          fi
          git commit -m "chore(search): finalize verified merge gate cleanup"
          git push origin HEAD:agent/data-search-production-v2-20260916-1246-851a5c9
