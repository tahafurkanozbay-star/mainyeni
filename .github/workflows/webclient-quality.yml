name: Webclient Quality

on:
  pull_request:
    paths:
      - 'Webclient.app/**'
      - '.github/workflows/webclient-quality.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'Webclient.app/**'
      - '.github/workflows/webclient-quality.yml'

permissions:
  contents: read

concurrency:
  group: webclient-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Webclient.app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Webclient.app/package-lock.json

      - name: Install from lockfile
        run: npm ci

      - name: Production dependency audit (non-blocking legacy debt)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Lint when configured
        run: npm run lint --if-present

      - name: Typecheck when configured
        run: npm run typecheck --if-present

      - name: Test
        run: npm test -- --watchAll=false --runInBand

      - name: Production build
        env:
          CI: true
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build
