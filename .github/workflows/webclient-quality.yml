name: Webclient Quality

on:
  pull_request:
    paths:
      - 'Webclient.app/**'
      - '.github/workflows/webclient-quality.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'Webclient.app/**'
      - '.github/workflows/webclient-quality.yml'

permissions:
  contents: read

concurrency:
  group: webclient-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Webclient.app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Webclient.app/package-lock.json

      - name: Verify toolchain contract
        run: |
          node --version
          npm --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major !== 24) process.exit(1)"

      - name: Install from lockfile
        run: npm ci

      - name: Dependency and lockfile contract
        run: npm run dependency:verify

      - name: Experience quality guard self-test
        run: node scripts/experience-quality-audit.cjs --self-test

      - name: Experience quality guard
        run: node scripts/experience-quality-audit.cjs

      - name: Vite migration contract
        run: npm run quality:vite

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Strict lint
        run: npm run lint:strict

      - name: Strict TypeScript boundaries
        run: npm run typecheck

      - name: Full Vitest regression suite
        run: npm run test:ci

      - name: Native tooling regression suite
        run: npm run test:tooling

      - name: Build budget script tests
        run: npm run test:build-budget

      - name: Production Vite build and integrity manifest
        run: npm run build

      - name: Verify production bundle integrity
        run: npm run build:verify

      - name: Enforce production build budgets
        run: node scripts/web-build-budget.mjs build --strict
