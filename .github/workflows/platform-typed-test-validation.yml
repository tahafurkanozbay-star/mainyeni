name: Platform Typed Test Validation

on:
  pull_request:
    paths:
      - 'Webclient.app/src/platform/**/*.test.ts'
      - 'Webclient.app/src/platform/**/*.integration.test.ts'
      - 'Webclient.app/tsconfig.platform-tests.json'
      - 'Webclient.app/package.json'
      - 'tools/platform-language-baseline.json'
      - 'tools/platform-language-ratchet.mjs'
      - 'tools/platform-ts-cutover.test.mjs'
      - '.github/workflows/platform-typed-test-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'Webclient.app/src/platform/**/*.test.ts'
      - 'Webclient.app/src/platform/**/*.integration.test.ts'
      - 'Webclient.app/tsconfig.platform-tests.json'
      - 'tools/platform-language-baseline.json'

permissions:
  contents: read

concurrency:
  group: platform-typed-test-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typed-platform-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Webclient.app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Webclient.app/package-lock.json

      - name: Install from lockfile
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Enforce Platform language ratchet
        working-directory: .
        run: node tools/platform-language-ratchet.mjs --strict

      - name: Enforce Platform cutover contracts
        working-directory: .
        run: node --test tools/platform-ts-cutover.test.mjs tools/platform-language-ratchet.test.mjs

      - name: Strict Platform test TypeScript
        run: npm run typecheck:platform-tests -- --pretty false

      # Keep the established Platform suites separate from the dependency-governance
      # package so a failing CI step identifies the owning slice without weakening
      # coverage or relying on unavailable Actions log archives.
      - name: Focused migrated Platform baseline tests
        run: npx --no-install vitest run src/platform/bootstrap src/platform/http src/platform/performance --reporter=verbose

      - name: Dependency health and topology tests
        run: npx --no-install vitest run src/platform/runtime/runtimeDependencyHealthRegistry.test.ts src/platform/runtime/runtimeDependencyTopology.test.ts --reporter=verbose

      - name: Dependency readiness and failover tests
        run: npx --no-install vitest run src/platform/runtime/runtimeDependencyReadinessCoordinator.test.ts src/platform/runtime/runtimeDependencyFailoverPlanner.test.ts --reporter=verbose

      - name: Dependency SLO and change governance tests
        run: npx --no-install vitest run src/platform/runtime/runtimeDependencySloController.test.ts src/platform/runtime/runtimeDependencyChangeGuard.test.ts --reporter=verbose

      - name: Dependency deployment and incident tests
        run: npx --no-install vitest run src/platform/runtime/runtimeDependencyDeploymentGate.test.ts src/platform/runtime/runtimeDependencyIncidentCoordinator.test.ts --reporter=verbose

      - name: Dependency maintenance and evidence tests
        run: npx --no-install vitest run src/platform/runtime/runtimeDependencyMaintenanceRegistry.test.ts src/platform/runtime/runtimeDependencyEvidenceLedger.test.ts --reporter=verbose

      - name: Dependency operations integration tests
        run: npx --no-install vitest run src/platform/runtime/runtimeDependencyOperations.integration.test.ts --reporter=verbose

      - name: Remaining Platform runtime regression tests
        run: npx --no-install vitest run src/platform/runtime --exclude='src/platform/runtime/runtimeDependency*.test.ts' --exclude='src/platform/runtime/runtimeDependency*.integration.test.ts' --reporter=verbose
