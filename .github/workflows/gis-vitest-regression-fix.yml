name: GIS focused Vitest regression fix

on:
  push:
    branches:
      - agent/gis-deep-20260924-0912-00810ca

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[gis-vitest-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/gis-deep-20260924-0912-00810ca
          fetch-depth: 0
      - name: Align Promise validation semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          spatial = Path('Webclient.app/src/gis-engine/spatialOperationCoordinator.ts')
          text = spatial.read_text()
          old = "    const key = normalizeKey(request.key);"
          new = """    let key: string;
    try {
      key = normalizeKey(request.key);
    } catch (error: unknown) {
      return Promise.reject(error);
    }"""
          if old not in text:
              raise SystemExit('missing spatial key validation marker')
          spatial.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit focused regression fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Webclient.app/src/gis-engine/spatialOperationCoordinator.ts
          git commit -m "fix(gis): reject invalid operation keys through Promise API [gis-vitest-fix]"
          git push origin HEAD:agent/gis-deep-20260924-0912-00810ca
