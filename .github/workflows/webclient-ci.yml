name: Webclient CI

on:
  pull_request:
    paths:
      - 'Webclient.app/**'
      - '.github/workflows/webclient-ci.yml'
  push:
    branches: [main]
    paths:
      - 'Webclient.app/**'
      - '.github/workflows/webclient-ci.yml'

permissions:
  contents: read

concurrency:
  group: webclient-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Webclient.app
    env:
      NODE_OPTIONS: --openssl-legacy-provider
      CI: true
      GENERATE_SOURCEMAP: 'false'
      DISABLE_ESLINT_PLUGIN: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: Webclient.app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test -- --watchAll=false --runInBand

      - name: Production build
        run: npm run build

      - name: Dependency audit advisory
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
