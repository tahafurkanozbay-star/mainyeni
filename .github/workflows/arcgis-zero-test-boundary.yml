name: ArcGIS Zero Test Boundary

on:
  push:
    branches:
      - agent/arcgis-legacy-zero-20260917

permissions:
  contents: write

jobs:
  migrate-test-boundary:
    if: ${{ !contains(github.event.head_commit.message, '[arcgis-test-boundary]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/arcgis-legacy-zero-20260917
          fetch-depth: 0

      - name: Apply deterministic test boundary migration
        run: node .github/scripts/arcgis-zero-test-boundary.mjs

      - name: Verify migration diff
        run: |
          git diff --check
          test -n "$(git status --porcelain)"

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Webclient.app/src/Toolbox/GisQueryHelper.test.js
          git commit -m "test(gis): align query helper mock with runtime boundary [arcgis-test-boundary]"
          git push origin HEAD:agent/arcgis-legacy-zero-20260917
