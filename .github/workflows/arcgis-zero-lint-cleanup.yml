name: ArcGIS Zero Lint Cleanup

on:
  push:
    branches:
      - agent/arcgis-legacy-zero-20260917

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[arcgis-lint-cleanup]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/arcgis-legacy-zero-20260917
          fetch-depth: 0

      - name: Apply deterministic cleanup
        run: node .github/scripts/arcgis-zero-lint-cleanup.mjs

      - name: Verify cleanup diff
        run: |
          git diff --check
          test -n "$(git status --porcelain)"

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Webclient.app/src
          git commit -m "chore(gis): clear strict lint on zero-consumer migration [arcgis-lint-cleanup]"
          git push origin HEAD:agent/arcgis-legacy-zero-20260917
