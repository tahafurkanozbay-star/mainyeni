name: Data Search Lint Finalize

on:
  push:
    branches:
      - agent/data-search-production-v2-20260916-1246-851a5c9
    paths:
      - '.github/workflows/data-search-lint-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v7
        with:
          ref: agent/data-search-production-v2-20260916-1246-851a5c9
          fetch-depth: 0

      - name: Apply semantic lint cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'Webclient.app/src/data-search/datasetCatalog.ts': (
                  'for (const [alias, target] of [...this.aliasToKey.entries()]) {',
                  'for (const [alias, target] of this.aliasToKey.entries()) {'
              ),
              'Webclient.app/src/data-search/geocodingRuntime.ts': (
                  'for (const key of [...this.cache.keys()]) {',
                  'for (const key of this.cache.keys()) {'
              ),
              'Webclient.app/src/data-search/productionRuntime.ts': (
                  'for (const session of [...this.sessions]) session.dispose();',
                  'for (const session of this.sessions) session.dispose();'
              ),
          }
          for raw_path, (old, new) in replacements.items():
              path = Path(raw_path)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected pattern missing: {raw_path}')
              path.write_text(text.replace(old, new, 1))

          Path('.github/scripts/strict-ts-boundary-cleanup.py').unlink(missing_ok=True)
          Path('.github/workflows/data-search-lint-finalize.yml').unlink(missing_ok=True)
          PY

      - name: Validate changed Data Search lint
        working-directory: Webclient.app
        run: npx --yes oxlint --deny-warnings src/data-search

      - name: Commit only verified product cleanup
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Webclient.app/src/data-search .github/scripts .github/workflows
          git commit -m "fix(search): satisfy strict changed-source lint gate"
          git push origin HEAD:agent/data-search-production-v2-20260916-1246-851a5c9
