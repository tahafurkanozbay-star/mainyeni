name: Spatial Integrity Exact Optional Fix

on:
  push:
    branches:
      - agent/arcgis-legacy-zero-20260917

permissions:
  contents: write

jobs:
  fix-spatial-integrity-config:
    if: ${{ !contains(github.event.head_commit.message, '[spatial-integrity-exact-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/arcgis-legacy-zero-20260917
          fetch-depth: 0

      - name: Fix exact optional spread contract
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'Webclient.app/src/gis-engine/spatialIntegrityRuntime.ts';
          const source = fs.readFileSync(path, 'utf8');
          const before = `  const configuration: SpatialIntegrityConfiguration = {\n    expectedGeometryType: capabilities.geometryType,\n    allowedFields: capabilities.fieldNames,\n    ...overrides,\n  };`;
          const after = `  const configuration: SpatialIntegrityConfiguration = {\n    expectedGeometryType: capabilities.geometryType,\n    allowedFields: capabilities.fieldNames,\n  };\n  Object.assign(configuration, overrides);`;
          if (!source.includes(before)) throw new Error('Expected configuration spread block not found');
          const next = source.replace(before, after);
          fs.writeFileSync(path, next);
          NODE

      - name: Verify focused diff
        run: |
          git diff --check
          git diff -- Webclient.app/src/gis-engine/spatialIntegrityRuntime.ts

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Webclient.app/src/gis-engine/spatialIntegrityRuntime.ts
          git commit -m "fix(gis): preserve exact optional spatial integrity config [spatial-integrity-exact-fix]"
          git push origin HEAD:agent/arcgis-legacy-zero-20260917
