name: Admin GIS Lock Refresh (temporary)

on:
  push:
    branches:
      - 'agent/admin-gis-modernization-20260921-1115-218cc4c'
    paths:
      - 'Webclient.admin/package.json'
      - '.github/workflows/admin-gis-lock-refresh.yml'

permissions:
  contents: write

concurrency:
  group: admin-gis-lock-refresh
  cancel-in-progress: false

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Webclient.admin
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/admin-gis-modernization-20260921-1115-218cc4c
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile and remove temporary workflow
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Webclient.admin/package-lock.json
          git rm .github/workflows/admin-gis-lock-refresh.yml
          git commit -m "chore(admin-gis): refresh ArcGIS ESM lockfile"
          git push origin HEAD:agent/admin-gis-modernization-20260921-1115-218cc4c
