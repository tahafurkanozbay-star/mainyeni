<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6fd3" />
    <meta name="description" content="3B Altyapı ve Üstyapı Koordinasyon Web Uygulaması" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://js.arcgis.com" />
    <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css" />
    <link rel="stylesheet" href="./assets/style.css" />
    <script type="module" src="https://js.arcgis.com/5.1/"></script>
    <title>3B CBS Başkent</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.addEventListener("unhandledrejection", (event) => {
        const app = document.querySelector("#app");
        if (app && !app.children.length) app.innerHTML = `<div style="display:grid;place-items:center;height:100vh;background:#0b1c2b;color:white;font:16px system-ui;padding:24px;text-align:center"><div><strong>3B CBS Başkent başlatılamadı.</strong><p style="opacity:.75">ArcGIS CDN veya servis kataloğu erişimini kontrol edin.</p></div></div>`;
        console.error(event.reason);
      });
    </script>
    <noscript>Bu uygulamanın çalışması için JavaScript etkin olmalıdır.</noscript>
    <script type="module" src="./assets/main.js"></script>
  </body>
</html>
